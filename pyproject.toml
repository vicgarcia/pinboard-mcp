[project]
name = "pinboard-mcp"
version = "2.0.0"
description = "MCP server for Pinboard.in bookmarks"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "pinboard>=2.1.1",
    "python-dateutil>=2.8.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
]

[project.scripts]
pinboard-mcp = "pinboard_mcp:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
