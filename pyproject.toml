[project]
name = "pinboard-mcp"
version = "2.0.0"
description = "MCP server for Pinboard.in bookmarks"
authors = [
    { name = "vic Garcia", email = "vic.garcia@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "pinboard>=2.1.1",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
pinboard-mcp = "pinboard_mcp:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinboard_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v"]
